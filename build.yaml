changelog: |2-
  ### Jellyfin 12 release
  - Target Jellyfin Server 12, plugin ABI 12.0.0.0, and .NET 10.
  - Add installable ZIP packaging and plugin repository manifest automation.
  - Retain the Jellyfin 10.11 organizer, safety, approval, subtitle, and naming improvements.
  - Add explicit preserve-original-filename options for TV episodes and movies.
  - Add an option to always create season folders, including for existing flat series layouts.
  - Retry remote searches with normalized release-title separators.
  - Respect the manually selected library root when creating a new series or movie.
  - Allow manual creation when provider IDs are unavailable.
  - Prevent duplicate production-year suffixes in generated series and movie folders.
  - Retain Jellyfin naming-parser integration, safe file transfers, path authorization, and SQLite recovery fixes.
