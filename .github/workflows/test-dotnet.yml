name: '🧪 Test Plugin'

on:
  push:
    branches:
      - master
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches:
      - master
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Build
        run: dotnet build AutoOrganize.sln --configuration Release --no-incremental
      - name: Run Regression Suite
        run: dotnet run --project AutoOrganize.Tests/AutoOrganize.Tests.csproj --configuration Release --no-build
      - name: Test Manifest Automation
        run: python3 -m unittest discover --start-directory scripts/tests --pattern 'test_*manifest.py' --verbose
